name: deploy to Cloud Run
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGION: asia-northeast1
  SERVICE: machimado-agent
  REPO: machimado

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Artifact Registry（なければ作る）
        run: |
          gcloud config set project "${{ secrets.GCP_PROJECT_ID }}"
          gcloud artifacts repositories describe "$REPO" --location="$REGION" >/dev/null 2>&1 || \
            gcloud artifacts repositories create "$REPO" --repository-format=docker --location="$REGION" --description="machimado images"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
      - name: Build and push
        run: |
          IMAGE="$REGION-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/$REPO/$SERVICE:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Deploy
        run: |
          gcloud run deploy "$SERVICE" --image "$IMAGE" --region "$REGION" \
            --cpu 1 --memory 512Mi --concurrency 20 --timeout 300 --min-instances 0 --max-instances 3 \
            --set-env-vars "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }},MAPS_API_KEY=${{ secrets.MAPS_API_KEY }}" \
            --no-invoker-iam-check --quiet
          gcloud run services describe "$SERVICE" --region "$REGION" --format='value(status.url)'
